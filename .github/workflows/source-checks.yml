name: Source distribution checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Source and signing boundaries
        run: |
          python3 -m unittest discover -s tests -p test_release_compliance.py -v
          python3 -m unittest discover -s tests -p test_public_source.py -v
          python3 -m unittest discover -s tests -p test_release_build.py -v
          python3 -m unittest discover -s tests -p test_native_alignment.py -v
          python3 -m unittest discover -s tests -p test_signing_identity.py -v
      - name: Prepare public source set without publishing
        run: python3 tools/prepare-public-repo.py
      - name: Language preferences and CLI consent
        run: |
          python3 -m unittest discover -s tests -p test_language.py -v
          python3 -m unittest discover -s tests -p test_codex_launch.py -v
      - name: Source reconstruction and attribution
        run: |
          python3 -m unittest discover -s tests -p test_source_modifications.py -v
          python3 -m unittest discover -s tests -p test_historical_guest_inputs.py -v
          python3 -m unittest discover -s tests -p test_maven_sources.py -v
