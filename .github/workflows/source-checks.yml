name: Source distribution checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Release metadata and store text
        run: |
          python3 -m unittest discover -s tests -p test_store_preparation.py -v
          python3 tools/verify-store-preparation.py
      - name: Source and signing boundaries
        run: |
          python3 -m unittest discover -s tests -p test_release_compliance.py -v
          python3 -m unittest discover -s tests -p test_public_source.py -v
          python3 -m unittest discover -s tests -p test_release_build.py -v
          python3 -m unittest discover -s tests -p test_native_alignment.py -v
          python3 -m unittest discover -s tests -p test_signing_identity.py -v
          python3 -m unittest discover -s tests -p test_upload_signing.py -v
          python3 -m unittest discover -s tests -p test_upload_backup.py -v
          python3 -m unittest discover -s tests -p test_internal_signing.py -v
      - name: Prepare public source set without publishing
        run: python3 tools/prepare-public-repo.py
      - name: Language preferences and CLI consent
        run: |
          python3 -m unittest discover -s tests -p test_language.py -v
          python3 -m unittest discover -s tests -p test_codex_launch.py -v
          python3 -m unittest discover -s tests -p test_ai_install.py -v
          python3 -m unittest discover -s tests -p test_node_install.py -v
          python3 -m unittest discover -s tests -p test_tool_catalog.py -v
          python3 -m unittest discover -s tests -p test_tool_updates.py -v
          python3 -m unittest discover -s tests -p test_tool_manager.py -v
          python3 -m unittest discover -s tests -p test_tool_manager_lifecycle.py -v
          python3 -m unittest discover -s tests -p test_provider_disclosure.py -v
          python3 -m unittest discover -s tests -p test_guest_session_launcher.py -v
          python3 -m unittest discover -s tests -p test_prepare_app.py -v
          python3 -m unittest discover -s tests -p test_setup_download_proxy.py -v
      - name: Foreground service ownership and scoped cleanup
        run: |
          python3 -m unittest discover -s tests -p test_preparation_service.py -v
          python3 -m unittest discover -s tests -p test_preparation_notification.py -v
          python3 -m unittest discover -s tests -p test_initial_setup.py -v
          python3 -m unittest discover -s tests -p test_project_preparation.py -v
          python3 -m unittest discover -s tests -p test_preparation_process.py -v
          python3 -m unittest discover -s tests -p test_project_removal.py -v
      - name: Source reconstruction and attribution
        run: |
          python3 -m unittest discover -s tests -p test_source_archive.py -v
          python3 -m unittest discover -s tests -p test_coroutines_probe.py -v
          python3 -m unittest discover -s tests -p test_source_modifications.py -v
          python3 -m unittest discover -s tests -p test_historical_guest_inputs.py -v
          python3 -m unittest discover -s tests -p test_maven_sources.py -v
          python3 -m unittest discover -s tests -p test_maven_upstream_supplements.py -v
          python3 -m unittest discover -s tests -p test_embedded_maven_source.py -v
          python3 -m unittest discover -s tests -p test_debian_guest.py -v
          python3 -m unittest discover -s tests -p test_debian_package_sources.py -v
